name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bundle payload
        run: go run ./tools/bundle

      - name: Test Go packages
        run: go test ./...

      - name: Test capture isolation, diagnostics and update contracts
        run: node --test tools/test-capture.cjs tools/test-diagnostics.cjs tools/test-updates.cjs

      - name: Test stage, playback, diagnostics and update UI in Edge
        run: node tools/run-stage-tests.cjs

      - name: Build and validate executable
        shell: pwsh
        run: ./build.ps1

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist/Hugin.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Hugin.exe" | Set-Content -LiteralPath dist/checksums.txt -Encoding ascii

      - name: Upload validated executable
        uses: actions/upload-artifact@v4
        with:
          name: hugin-windows
          path: |
            dist/Hugin.exe
            dist/checksums.txt
          if-no-files-found: error
